name: Materialize verified AKR import
on:
  push:
    branches: [akr-final-consolidation-20261002]
    paths: ['.github/workflows/finalize-import.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Restore only hash-verified complete files
        run: python scripts/finalize_migration.py
      - name: Commit materialized files without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A paper tests scripts akr_final requirements-cpu.txt requirements-qwen.txt pyproject.toml migration
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize verified complete AKR sources and portable paper assets'
            git push origin HEAD:${{ github.ref_name }}
          fi
