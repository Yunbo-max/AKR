name: Export AKR consolidation snapshot
on:
  push:
    branches: [akr-final-consolidation-20261002]
    paths: ['.github/workflows/export-final-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export without executing project code
        run: git archive --format=zip --output="$RUNNER_TEMP/akr-consolidation.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: akr-consolidation-snapshot
          path: ${{ runner.temp }}/akr-consolidation.zip
          retention-days: 7
