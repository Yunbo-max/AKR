name: Complete audited AKR consolidation
on:
  push:
    branches: [akr-final-consolidation-20261002]
    paths: ['.github/workflows/complete-20261003.yml']
permissions:
  contents: write
concurrency:
  group: akr-completion-20261003
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONPATH: src:.
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: akr-final-consolidation-20261002
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate entire source transport before materializing ordinary files
        run: python scripts/materialize_20261003.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
      - name: Validate executable contracts without model downloads
        run: |
          python -m pytest -q --junitxml="$RUNNER_TEMP/akr-tests.xml" | tee "$RUNNER_TEMP/akr-tests.log"
          python scripts/check_akr_release.py | tee "$RUNNER_TEMP/akr-release-check.json"
          python scripts/run_akr_release.py plan > "$RUNNER_TEMP/akr-plan.json"
          python -m compileall -q src akr_closing akr_final scripts tests
          git diff --check
      - name: Record verification and commit readable sources
        run: |
          python - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          suites=ET.parse(temp/'akr-tests.xml').getroot().findall('.//testsuite')
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          if totals['failures'] or totals['errors'] or not totals['tests']:
              raise SystemExit('CPU test gate did not pass')
          integrity=json.loads((temp/'akr-release-check.json').read_text())
          if not integrity['complete']:raise SystemExit('Release integrity failed')
          receipt=json.loads(Path('migration/COMPLETION_VERIFIED_20261003.json').read_text())
          out=Path('docs/research/REMOTE_VERIFICATION_20261003.json')
          record={'complete':True,'workflow_run_id':os.environ['GITHUB_RUN_ID'],
            'incoming_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'payload_sha256':receipt['decoded_sha256'],'cpu_tests':totals,
            'release_checks':integrity,'new_scientific_experiments':0,'S1_status':'implemented_not_run_on_real_model'}
          out.write_text(json.dumps(record,indent=2)+'\n')
          subprocess.run(['git','add','--',*receipt['files'].keys(),'migration/COMPLETION_VERIFIED_20261003.json',str(out)],check=True)
          PY
          git config user.name 'AKR consolidation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Complete AKR code, manuscript and research-autopilot audit with verified CPU tests'
      - name: Push checked integration commit without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:akr-final-consolidation-20261002
      - name: Export exact materialized source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/akr-final-source-sha.txt"
          git archive --format=zip --output="$RUNNER_TEMP/akr-final-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akr-verified-final-source
          path: |
            ${{ runner.temp }}/akr-final-source.zip
            ${{ runner.temp }}/akr-final-source-sha.txt
            ${{ runner.temp }}/akr-tests.xml
            ${{ runner.temp }}/akr-tests.log
            ${{ runner.temp }}/akr-release-check.json
            ${{ runner.temp }}/akr-plan.json
          retention-days: 14
