name: Verify and publish prepared AKR rebuttal patch
on:
  push:
    branches: [research/iclr-rebuttal-stability-20261104]
    paths: ['.github/workflows/publish-akr-rebuttal-20261104.yml']
permissions:
  contents: write
concurrency:
  group: akr-rebuttal-publish-20261104
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and apply exact prepared patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,lzma,os,subprocess
          from pathlib import Path
          expected={
            'README.md':'86712ef1b7602b83980d7423ead644d19bbafe7d',
            'akr_closing/backend.py':'a766797f1dac2e51368728eed62b934453d64d2e',
            'akr_final/rebuttal_cli.py':'bf02dab34a0a9253177b5bcb0db0fbd4841a5a52',
            'akr_final/rebuttal_math.py':'cc66c11ca3c6323d0f7bf5c336bb6cf8ee15e22b',
            'akr_final/rebuttal_plan.py':'429db15397d46580e63c1d47bebc3a25dd574223',
            'akr_final/rebuttal_runner.py':'e6bb44af77518a4268fbbd6001a915a0f727e8de',
            'akr_final/runner.py':'072b382bfcd6111566b5c8f17b7f738139130a3e',
            'configs/akr_rebuttal.yaml':'71c442918ea9aa95cc4d76c601a7b04a990059bc',
            'docs/ICLR_REBUTTAL_RUNBOOK_ZH.md':'aea07237126baf64147846d24a6addfb53a14886',
            'docs/rebuttal/README.md':'d46ff0454312d49c21054c0ae2553566f887e05e',
            'docs/rebuttal/VALIDATION_20261104.json':'352638f5340a64d17b9091dfc8ee393ba976b51c',
            'docs/superpowers/plans/2026-11-04-akr-rebuttal.md':'f3df131203b25a45a81309a9190f0f1e6f35c69b',
            'scripts/run_akr_rebuttal.py':'99305c00fc8fed8ca95e91df1baf8a0a9d8adf30',
            'src/animal_omni/kv_hooks.py':'265af7a7390fa5f488e4d4bc6366986cfd6fdc9e',
            'tests/test_rebuttal_plan.py':'72ac15df6276ee7dc72e6adfa3cf225f44791f65',
            'tests/test_rebuttal_runner.py':'8dc19be1449c57f0bc62baf2258c0df88669fa96',
            'tests/test_rebuttal_stability.py':'08a5532773dbbe8a18c60e9f286a6662327f59d1'}
          base='95bcf7c99cc011c1d0d852abfa640fe2d01690f1'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          if subprocess.check_output(['git','status','--porcelain'],text=True).strip():
              raise SystemExit('Refusing a dirty checkout')
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={f'.github/akr-rebuttal-transfer/{i:02}.part' for i in range(4)}|{'.github/workflows/publish-akr-rebuttal-20261104.yml'}
          if changed!=allowed: raise SystemExit('Unexpected concurrent source changes')
          packed=b''.join(Path(f'.github/akr-rebuttal-transfer/{i:02}.part').read_bytes() for i in range(4))
          if hashlib.sha256(packed).hexdigest()!='9d8d28a622ee19d5ccb88f1bf397d9f2429c69429daa064cf7230082835527d8':
              raise SystemExit('Transport checksum failed')
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch=decoder.decompress(packed,max_length=200000)
          if not decoder.eof or decoder.unused_data or len(patch)!=97878:
              raise SystemExit('Incomplete or oversized patch')
          if hashlib.sha256(patch).hexdigest()!='ff34c0b9a16816dd02adf8d1ff5b87d8bb8d6b2881b6c3d6bf2c97ddab343843':
              raise SystemExit('Patch checksum failed')
          temp=Path(os.environ['RUNNER_TEMP']); p=temp/'akr-rebuttal.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged!=set(expected):raise SystemExit('Unexpected patch paths')
          for name,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              if actual!=sha:raise SystemExit('Postimage mismatch: '+name)
          (temp/'akr-expected-files.json').write_text(json.dumps(expected,indent=2)+'\n')
          print('Verified all 17 prepared source files; no data or manuscript changes.')
          PY
      - name: Install CPU-only verification environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
      - name: Run complete software and release verification
        run: |
          set -euo pipefail
          python -m pytest -q --junitxml="$RUNNER_TEMP/akr-rebuttal-tests.xml" | tee "$RUNNER_TEMP/akr-rebuttal-tests.log"
          python scripts/check_akr_release.py | tee "$RUNNER_TEMP/akr-release-check.json"
          python scripts/run_akr_rebuttal.py plan --tasks core,scale,dogs > "$RUNNER_TEMP/akr-rebuttal-plan.json"
          python scripts/run_akr_rebuttal.py plan --tasks all > "$RUNNER_TEMP/akr-rebuttal-plan-all.json"
          python -m compileall -q src akr_closing akr_final scripts tests
          git diff --cached --check
      - name: Record verified publication and remove temporary transfer files
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          suites=ET.parse(temp/'akr-rebuttal-tests.xml').getroot().findall('.//testsuite')
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          if counts!={'tests':182,'failures':0,'errors':0,'skipped':0}:raise SystemExit('Unexpected test outcome: '+str(counts))
          release=json.loads((temp/'akr-release-check.json').read_text())
          if not release.get('complete') or release.get('checks')!=116:raise SystemExit('Release checks failed')
          expected=json.loads((temp/'akr-expected-files.json').read_text())
          for name,sha in expected.items():
              if subprocess.check_output(['git','hash-object',name],text=True).strip()!=sha:
                  raise SystemExit('Source changed during tests: '+name)
          note=Path('docs/rebuttal/README.md')
          note.write_text('# Rebuttal verification artifacts\n\nSee `../ICLR_REBUTTAL_RUNBOOK_ZH.md` for benchmark, dataset, model and execution settings.\n\n`VALIDATION_20261104.json` is the original pre-publication local verification snapshot; its `remote_pushed: false` field records that earlier state.\n\n`REMOTE_PUBLICATION_20261104.json` records the fresh remote checks for this publication: 182 CPU tests and 116 release checks. The prepared code, configs and tests were checksum-verified before and after testing.\n\nNo new model inference, scientific accuracy or GPU experiment is claimed.\n')
          plan=Path('docs/superpowers/plans/2026-11-04-akr-rebuttal.md')
          old='- [ ] Publish through the user\'s authenticated local Git client; this session has read-only GitHub access.'
          new='- [x] Publish through the connected GitHub interface after fresh remote CPU verification; see docs/rebuttal/REMOTE_PUBLICATION_20261104.json.'
          text=plan.read_text()
          if old not in text:raise SystemExit('Unexpected publication status text')
          plan.write_text(text.replace(old,new))
          readme=Path('README.md');text=readme.read_text();marker='## ICLR rebuttal stability addendum\n'
          status='\n**Publication verification:** 182 CPU tests and 116 release checks passed remotely; [verification record](docs/rebuttal/REMOTE_PUBLICATION_20261104.json). No GPU experiment was started.\n'
          if marker not in text:raise SystemExit('Missing rebuttal README entry')
          readme.write_text(text.replace(marker,marker+status,1))
          receipt=Path('docs/rebuttal/REMOTE_PUBLICATION_20261104.json')
          record={'date':'2026-11-04','upstream_base':'95bcf7c99cc011c1d0d852abfa640fe2d01690f1',
            'workflow_run_id':os.environ['GITHUB_RUN_ID'],'bootstrap_commit':os.environ['GITHUB_SHA'],
            'branch':'research/iclr-rebuttal-stability-20261104','cpu_tests':counts,'release_integrity':release,
            'prepared_patch_sha256':'ff34c0b9a16816dd02adf8d1ff5b87d8bb8d6b2881b6c3d6bf2c97ddab343843',
            'prepared_source_blobs':expected,
            'published_file_sha256':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in expected},
            'publication_only_edits':['README.md','docs/rebuttal/README.md','docs/superpowers/plans/2026-11-04-akr-rebuttal.md'],
            'python':sys.version,'model_inference_runs':0,'gpu_experiments':0,
            'paper_and_historical_results_changed':False,'scope':'software verification and source publication, not scientific validation'}
          receipt.write_text(json.dumps(record,indent=2)+'\n')
          subprocess.run(['git','add','--',*expected,str(receipt)],check=True)
          subprocess.run(['git','rm','-r','--','.github/akr-rebuttal-transfer','.github/workflows/publish-akr-rebuttal-20261104.yml'],check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish AKR rebuttal stability code and complete experiment queue; 182 CPU tests passed'
      - name: Push verified branch without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin HEAD:research/iclr-rebuttal-stability-20261104
      - name: Export exact published source
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/akr-rebuttal-source-sha.txt"
          git archive --format=zip --output="$RUNNER_TEMP/akr-rebuttal-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akr-rebuttal-published-verification
          path: |
            ${{ runner.temp }}/akr-rebuttal-source.zip
            ${{ runner.temp }}/akr-rebuttal-source-sha.txt
            ${{ runner.temp }}/akr-rebuttal-tests.xml
            ${{ runner.temp }}/akr-rebuttal-tests.log
            ${{ runner.temp }}/akr-release-check.json
            ${{ runner.temp }}/akr-rebuttal-plan.json
            ${{ runner.temp }}/akr-rebuttal-plan-all.json
          retention-days: 14
